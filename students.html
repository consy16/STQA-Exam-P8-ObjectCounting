
<!DOCTYPE html>
<html>
<head>
    <title>STQA Object Counting</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            color: #333;
        }

        .section {
            margin-bottom: 25px;
        }

        input, button, select {
            margin: 5px;
            padding: 8px;
        }

        img {
            width: 120px;
            height: 80px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1>STQA Web Page Object Counting</h1>

    <div class="section">
        <h2>Links</h2>

        <a href="https://www.google.com">Google</a>
        <a href="https://www.github.com">GitHub</a>
        <a href="https://www.selenium.dev">Selenium</a>
        <a href="https://www.wikipedia.org">Wikipedia</a>
    </div>

    <div class="section">
        <h2>Images</h2>

        <img src="https://via.placeholder.com/120x80?text=Image1" alt="Image 1">
        <img src="https://via.placeholder.com/120x80?text=Image2" alt="Image 2">
        <img src="https://via.placeholder.com/120x80?text=Image3" alt="Image 3">
    </div>

    <div class="section">
        <h2>Buttons</h2>

        <button type="button">Login</button>
        <button type="button">Submit</button>
        <button type="button">Reset</button>
    </div>

    <div class="section">
        <h2>Input Elements</h2>

        <input type="text" placeholder="Enter Name">
        <input type="email" placeholder="Enter Email">
        <input type="password" placeholder="Enter Password">
        <input type="number" placeholder="Enter Age">
        <input type="checkbox"> Accept Terms
    </div>

</body>
</html>
